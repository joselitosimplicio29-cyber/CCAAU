name: Deploy CCAAU Tema WordPress

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy via Webhook
        run: |
          curl -X POST "http://187.77.42.220:9000/hooks/deploy-ccaau" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature: sha1=$(echo -n '{}' | openssl dgst -sha1 -hmac 'ccaau-deploy-2026' | sed 's/.*= //')" \
            -d '{}'
